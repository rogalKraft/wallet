org.gradle.jvmargs=-Xmx2048M

minecraft_version=26.2
# Classic Forge dropped - Architectury no longer publishes a Forge bridge artifact for unobfuscated
# MC 26.x. NeoForge is treated as the Forge-family loader instead (see settings.gradle).
enabled_platforms=fabric,neoforge

archives_base_name=Wallet
mod_version=1.0-SNAPSHOT
maven_group=org.wallet.rogalik

architectury_version=21.0.7

fabric_loader_version=0.19.3
fabric_api_version=0.156.0+26.2
# Dev-only soft dependency: loaded alongside the client in :fabric:runClient so config-screen
# integration can be tested, but never a hard dependency for end users (see fabric.mod.json "suggests").
modmenu_version=20.0.1

# NeoForge has no stable build for Minecraft 26.2 yet (last stable was 26.1.2.94 on MC 26.1).
# Pinned to the current beta best-effort; bump to the first stable 26.2 release once available.
neoforge_version=26.2.0.51-beta
