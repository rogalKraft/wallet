org.gradle.jvmargs=-Xmx2048M

minecraft_version=26.3
# Classic Forge dropped - Architectury no longer publishes a Forge bridge artifact for unobfuscated
# MC 26.x. NeoForge is treated as the Forge-family loader instead (see settings.gradle).
enabled_platforms=fabric,neoforge

archives_base_name=Wallet
# Continues the original datapack's version line (last release: Wallet 2.6 for MC 1.21.6).
# Major bump to 3.0.0 because this is a full reimplementation as a real mod, not a datapack.
# Retargeted to 26.3 (Wilderness Bound, released 2026-09-15) without a mod_version bump -
# same rule as the datapack projects: the version grows on content/logic changes, not on a
# version retarget alone.
mod_version=3.0.0
maven_group=org.wallet.rogalik

architectury_version=22.0.2

fabric_loader_version=0.19.5
fabric_api_version=0.161.0+26.3
# Dev-only soft dependency: loaded alongside the client in :fabric:runClient so config-screen
# integration can be tested, but never a hard dependency for end users (see fabric.mod.json "suggests").
# Left on the last stable 26.2-line build - the only 26.3 build published so far (21.0.0-beta.1,
# 2026-09-11) is a beta and this is a dev-only convenience integration, not worth destabilizing for.
modmenu_version=20.0.1

# NeoForge has no stable build for Minecraft 26.3 yet (last stable was 26.2.0.88 on MC 26.2,
# reached after this was previously pinned to a 26.2 beta - bump the *next* stable pin promptly).
# Pinned to the current 26.3 beta best-effort; bump to the first stable 26.3 release once available.
neoforge_version=26.3.0.6-beta
