name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: gradle/actions/wrapper-validation@v4

      # Minecraft 26.2 requires Java 25. Verify Temurin 25 is GA on GitHub-hosted runners;
      # this is very new as of Aug 2026 and may need a fallback distribution.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - uses: gradle/actions/setup-gradle@v4

      # Fabric is the required platform - a failure here fails the job. Classic Forge is not built:
      # Architectury stopped publishing a Forge bridge artifact for unobfuscated MC 26.x; NeoForge
      # is treated as the Forge-family loader instead (see settings.gradle / gradle.properties).
      - name: Build Fabric
        run: ./gradlew :fabric:build --continue

      # NeoForge currently only has a beta build for MC 26.2 (see gradle.properties) - best
      # effort only, does not block the pipeline.
      - name: Build NeoForge (best-effort)
        run: ./gradlew :neoforge:build --continue
        continue-on-error: true

      - uses: actions/upload-artifact@v4
        with:
          name: wallet-fabric
          path: fabric/build/libs/*.jar
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: wallet-neoforge
          path: neoforge/build/libs/*.jar
          if-no-files-found: warn

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
      - uses: softprops/action-gh-release@v2
        with:
          files: "**/*.jar"
